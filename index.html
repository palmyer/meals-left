<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生饭量余额 · 人生可视化</title>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/wheel.css">
</head>
<body>
<div class="wrap">
  <header class="tool-head">
    <a class="back" href="preview.html" target="_top">📱 手机预览版</a>
    <h1>人生饭量余额</h1>
    <p class="sub">吃饭是无意识的日常，但一生的饭量有总额度</p>
  </header>

  <section class="card" id="settingsCard"></section>
  <section class="card" id="resultCard"></section>

  <p class="hint" style="text-align:center">每一顿都值得认真吃。</p>
</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="sheet-toolbar">
    <div class="sheet-title" id="sheetTitle">选择</div>
    <button class="done-btn" id="sheetDone">完成</button>
  </div>
  <div class="wheel-wrap">
    <div class="wheel-mask-top"></div>
    <div class="wheel-mask-bottom"></div>
    <div class="wheel-band"></div>
    <div class="wheel-row" id="wheelRow"></div>
  </div>
</div>

<script src="shared/core.js"></script>
<script src="shared/wheel.js"></script>
<script>
var state = {
  birthday: LGF.getBirthday(),
  lifespan: LGF.getLifespan(),
  mealsPerDay: parseInt(LGF.get('ml-meals', '3'), 10) || 3
};

function render() {
  LGF.setBirthday(state.birthday);
  LGF.setLifespan(state.lifespan);
  LGF.set('ml-meals', String(state.mealsPerDay));

  var s = LGF.computeLife(state.birthday, state.lifespan);
  var eaten = s.daysLived * state.mealsPerDay;
  var left = s.remainingDays * state.mealsPerDay;
  var total = eaten + left;

  document.getElementById('settingsCard').innerHTML =
    '<div class="row clickable" id="birthdayRow"><span class="label">生日</span>' +
      '<span class="value">' + state.birthday + '<span class="chevron">›</span></span></div>' +
    '<div class="separator"></div>' +
    '<div class="row clickable" id="lifespanRow"><span class="label">预期寿命</span>' +
      '<span class="value">' + state.lifespan + ' 岁<span class="chevron">›</span></span></div>' +
    '<div class="separator"></div>' +
    '<div class="row clickable" id="mealsRow"><span class="label">每天几顿</span>' +
      '<span class="value">' + state.mealsPerDay + ' 顿<span class="chevron">›</span></span></div>';

  document.getElementById('resultCard').innerHTML =
    '<div class="stat-cap">人生饭量余额</div>' +
    '<div class="stat-big">' + LGF.fmt(left) + '<span class="stat-unit">顿</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + (eaten / total * 100) + '%"></div></div>' +
    '<div class="stat-cells">' +
      '<div class="stat-cell"><div class="num">' + LGF.fmt(eaten) + '</div><div class="cap">已吃掉（顿）</div></div>' +
      '<div class="stat-cell"><div class="num">' + (eaten / total * 100).toFixed(1) + '%</div><div class="cap">额度已消耗</div></div>' +
      '<div class="stat-cell"><div class="num">' + LGF.fmt(total) + '</div><div class="cap">一生总额（顿）</div></div>' +
    '</div>' +
    '<div class="stat-foot">你已经吃掉人生 <b style="color:var(--accent)">' + (eaten / total * 100).toFixed(1) + '%</b> 的饭<br>' +
    '按每天 ' + state.mealsPerDay + ' 顿，还能再吃 ' + LGF.fmt(left) + ' 顿<br>' +
    '其中和重要的人一起吃的，才是值得的一顿。</div>';

  document.getElementById('birthdayRow').addEventListener('click', function () {
    WheelUI.openDate(state.birthday,
      function (v) { state.birthday = v; render(); },
      function (v) {
        var el = document.querySelector('#birthdayRow .value');
        if (el) el.innerHTML = v + '<span class="chevron">›</span>';
      }, render);
  });
  document.getElementById('lifespanRow').addEventListener('click', function () {
    var items = [];
    for (var i = 60; i <= 100; i++) items.push(i + ' 岁');
    WheelUI.open('预期寿命', [{ items: items, index: state.lifespan - 60 }],
      function (idx) { state.lifespan = 60 + idx[0]; render(); },
      function (idx) {
        var el = document.querySelector('#lifespanRow .value');
        if (el) el.innerHTML = (60 + idx[0]) + ' 岁<span class="chevron">›</span>';
      }, render);
  });
  document.getElementById('mealsRow').addEventListener('click', function () {
    var items = [];
    for (var i = 1; i <= 6; i++) items.push(i + ' 顿');
    WheelUI.open('每天几顿', [{ items: items, index: state.mealsPerDay - 1 }],
      function (idx) { state.mealsPerDay = idx[0] + 1; render(); },
      function (idx) {
        var el = document.querySelector('#mealsRow .value');
        if (el) el.innerHTML = (idx[0] + 1) + ' 顿<span class="chevron">›</span>';
      }, render);
  });
}

WheelUI.init();
render();
</script>
</body>
</html>
